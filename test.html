<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>합! 결! 연결 테스트</title>
  <style>
    :root { --blue:#1E88E5; --red:#E53935; --green:#43A047; --ink:#222; --sub:#666; --line:#ddd; --bg:#f5f6f8; }
    * { box-sizing: border-box; }
    body { margin:0; font-family: system-ui, "Malgun Gothic", sans-serif; background:var(--bg); color:var(--ink); }
    .wrap { max-width: 640px; margin: 0 auto; padding: 20px 16px 40px; }
    h1 { font-size: 24px; margin: 0 0 4px; }
    .sub { color: var(--sub); margin: 0 0 16px; font-size: 14px; }
    .card { background:#fff; border:1px solid var(--line); border-radius:14px; padding:16px; margin-bottom:14px; }
    .status { font-size: 20px; font-weight: 700; }
    .ok { color: var(--green); } .bad { color: var(--red); } .wait { color: var(--sub); }
    .row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
    input { font-size:16px; padding:8px 10px; border:1px solid var(--line); border-radius:8px; width: 160px; }
    .big { width:100%; font-size:26px; font-weight:800; padding:22px; border:0; border-radius:14px; background:var(--blue); color:#fff; cursor:pointer; }
    .big:active { transform: scale(.98); }
    .big:disabled { background:#aaa; cursor:default; }
    .small { font-size:14px; padding:6px 12px; border:1px solid var(--line); border-radius:8px; background:#fff; cursor:pointer; }
    ol { margin: 8px 0 0; padding-left: 26px; }
    li { padding: 3px 0; }
    li.me { font-weight: 700; color: var(--blue); }
    .help { font-size: 14px; color: var(--sub); line-height: 1.6; }
    .help b { color: var(--ink); }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>합! 결! 연결 테스트</h1>
    <p class="sub">학생 크롬북 2대 이상에서 이 페이지를 열고, 버튼을 눌러 보세요.</p>

    <div class="card">
      <div id="status" class="status wait">연결 중…</div>
      <div id="statusHelp" class="help"></div>
      <div class="help" style="margin-top:6px">지금 이 페이지를 연 기기: <b id="online">-</b>대</div>
    </div>

    <div class="card">
      <div class="row" style="margin-bottom:12px">
        <span>이 기기 이름</span>
        <input id="name" maxlength="12">
      </div>
      <button id="btnPress" class="big" disabled>눌러 보기</button>
      <div id="myDelay" class="help" style="margin-top:8px"></div>
    </div>

    <div class="card">
      <div class="row" style="justify-content:space-between">
        <b>누른 순서 (서버에 도착한 순서)</b>
        <button id="btnClear" class="small">기록 지우기</button>
      </div>
      <ol id="list"></ol>
    </div>

    <div class="card help">
      <b>확인할 것</b><br>
      ① 위에 <b>✅ 연결됨</b>이 뜨나요?<br>
      ② 한 기기에서 누르면 <b>다른 기기 목록에도 바로</b> 뜨나요?<br>
      ③ 두 사람이 "하나 둘 셋" 하고 동시에 누르면, 모든 기기에서 <b>순서가 똑같이</b> 보이나요?<br>
      ④ "왕복 시간"이 몇 초쯤 나오나요? (0.3초 이하면 충분해요)
    </div>
  </div>

  <!-- Firebase (인터넷에서 불러옴) -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
  <script>
    // ▼ Firebase 콘솔에서 복사한 설정을 여기에 넣는다
    var FIREBASE_CONFIG = {
      apiKey: "AIzaSyDa1iFfVT3MvbucSaef3IpagLJM_3RtCxY",
      authDomain: "hapgyeol.firebaseapp.com",
      databaseURL: "https://hapgyeol-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "hapgyeol",
      storageBucket: "hapgyeol.firebasestorage.app",
      messagingSenderId: "84310479080",
      appId: "1:84310479080:web:44d2606020087cbe49b95d"
    };
    // ▲

    var $ = function (id) { return document.getElementById(id); };
    var myId = Math.random().toString(36).slice(2, 10);
    var delays = [];

    // 이름: 연습 모드에 저장된 학번·이름이 있으면 그걸 쓴다
    (function () {
      var name = '기기 ' + Math.floor(10 + Math.random() * 90);
      try {
        var s = JSON.parse(localStorage.getItem('hapgyeol-save-v1') || 'null');
        if (s && s.student && s.student.name) name = s.student.name;
      } catch (e) { /* 무시 */ }
      $('name').value = name;
    })();

    function setStatus(cls, text, help) {
      $('status').className = 'status ' + cls;
      $('status').textContent = text;
      $('statusHelp').textContent = help || '';
    }

    function timeText(ms) {
      var d = new Date(ms);
      function p(n, w) { n = String(n); while (n.length < w) n = '0' + n; return n; }
      return p(d.getHours(), 2) + ':' + p(d.getMinutes(), 2) + ':' + p(d.getSeconds(), 2) + '.' + p(d.getMilliseconds(), 3);
    }

    function start() {
      if (typeof firebase === 'undefined') {
        setStatus('bad', '❌ Firebase를 불러오지 못했어요', '인터넷이 끊겼거나, 학교 와이파이가 gstatic.com 주소를 막고 있을 수 있어요.');
        return;
      }
      if (!FIREBASE_CONFIG.databaseURL) {
        setStatus('bad', '⚙️ 아직 Firebase 설정이 없어요', '선생님이 Firebase 프로젝트를 만든 뒤 설정을 넣어야 해요.');
        return;
      }

      firebase.initializeApp(FIREBASE_CONFIG);
      var db = firebase.database();
      var connected = false;

      // 10초 안에 연결이 안 되면 안내
      setTimeout(function () {
        if (!connected) setStatus('bad', '❌ 서버에 연결되지 않아요', '학교 와이파이가 Firebase 주소(firebaseio.com / firebasedatabase.app)를 막고 있을 수 있어요. 휴대폰 핫스팟으로도 해 보면 원인을 알 수 있어요.');
      }, 10000);

      // 연결 상태
      db.ref('.info/connected').on('value', function (snap) {
        connected = snap.val() === true;
        if (connected) {
          setStatus('ok', '✅ 연결됨');
          $('btnPress').disabled = false;
          var me = db.ref('test/online/' + myId);
          me.onDisconnect().remove();
          me.set(true);
        } else {
          $('btnPress').disabled = true;
        }
      });

      // 접속한 기기 수
      db.ref('test/online').on('value', function (snap) {
        $('online').textContent = snap.numChildren();
      });

      // 누른 순서: 서버 시각 순으로 최근 20개
      db.ref('test/presses').orderByChild('at').limitToLast(20).on('value', function (snap) {
        var items = [];
        snap.forEach(function (c) { items.push(c.val()); });
        var html = '';
        items.forEach(function (it) {
          var cls = it.dev === myId ? ' class="me"' : '';
          var name = String(it.name || '').replace(/[<>&"]/g, '');
          html += '<li' + cls + '>' + name + ' — ' + (it.at ? timeText(it.at) : '…') + '</li>';
        });
        $('list').innerHTML = html || '<li style="list-style:none;margin-left:-26px;color:#666">아직 누른 사람이 없어요</li>';
      });

      // 누르기
      $('btnPress').addEventListener('click', function () {
        var t0 = performance.now();
        db.ref('test/presses').push({
          name: $('name').value.trim() || '이름 없음',
          dev: myId,
          at: firebase.database.ServerValue.TIMESTAMP
        }).then(function () {
          var sec = (performance.now() - t0) / 1000;
          delays.push(sec);
          var avg = delays.reduce(function (a, b) { return a + b; }, 0) / delays.length;
          $('myDelay').textContent = '왕복 시간: 이번 ' + sec.toFixed(2) + '초 / 평균 ' + avg.toFixed(2) + '초 (' + delays.length + '번)';
        }).catch(function (e) {
          $('myDelay').textContent = '보내기 실패: ' + (e && e.message ? e.message : e);
        });
      });

      // 기록 지우기
      $('btnClear').addEventListener('click', function () {
        if (confirm('누른 기록을 모두 지울까요? (모든 기기에서 지워져요)')) db.ref('test/presses').remove();
      });
    }

    start();
  </script>
</body>
</html>
